<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>Bonx Banx: Ultimate Smartphone Edition</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Courier New', monospace;
            text-align: center;
            overflow: hidden;
            touch-action: none; 
            
            /* 画面中央寄せ */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #game-container {
            width: 100%;
            max-width: 500px; /* スマホでちょうどよく広がるサイズに調整 */
            box-sizing: border-box;
            padding: 0 12px; 
            position: relative;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 8px 16px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            background: #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        #canvas-wrapper {
            width: 100%;
            margin-bottom: 12px;
            position: relative;
        }
        canvas {
            background-color: #0d0d11;
            border: 6px solid #3a2211; 
            border-radius: 8px;
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            touch-action: none;
        }

        #action-container {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: space-between;
        }

        #btn-instructions {
            flex: 1;
            background: linear-gradient(145deg, #004444, #002222);
            border: 2px solid #00ffff;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            padding: 16px 10px;
            border-radius: 12px;
            box-shadow: 0 4px 0 #001111, 0 0 8px rgba(0,255,255,0.3);
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.05s ease;
        }
        #btn-instructions:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #001111, 0 0 4px rgba(0,255,255,0.5);
            background: #001111;
        }

        #btn-giveup {
            flex: 1;
            background: linear-gradient(145deg, #441111, #220000);
            border: 2px solid #882222;
            color: #ffaaaa;
            font-size: 15px;
            font-weight: bold;
            padding: 16px 10px;
            border-radius: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #1a0000;
            cursor: pointer;
            touch-action: none;
            white-space: pre-wrap;
            line-height: 1.2;
        }
        #btn-giveup:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1a0000;
            background: #330000;
        }

        #instructions-screen {
            display: none;
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            background-color: rgba(13, 13, 17, 0.95);
            border: 4px solid #00ff00;
            border-radius: 12px;
            z-index: 10;
            box-sizing: border-box;
            padding: 16px;
            text-align: left;
            box-shadow: 0 0 20px rgba(0,255,0,0.4);
            display: flex;
            flex-direction: column;
        }
        #instructions-title {
            color: #00ff00;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-top: 0;
            margin-bottom: 12px;
            border-bottom: 2px dashed #00ff00;
            padding-bottom: 6px;
        }
        #instructions-text {
            font-size: 15px;
            line-height: 1.6;
            color: #ffffff;
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 15px;
            padding-right: 4px;
        }
        #instructions-text b { color: #ffcc00; }

            display: block;
            margin: 0 auto;
            background: #222;
            border: 2px solid #ffffff;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;

        }

                <b>【ルール】</b><br>
                ・すべてのニンジンを回収させないと、バンクス君は家に入れません。<br>
                ・バンクス君は直進を続け、壁や青ブロックにぶつかると右に曲がります。<br><br>
                <b>【基本操作】</b><br>
                ・画面を<b>なぞって（ドラッグして）</b>プレイヤーを移動させます。<br>

            <button id="btn-close-instructions">戻る (BACK)</button>

function playMelody(melodyArray) {
    let timeOffset = 0; 
    melodyArray.forEach((note) => {
        if (note.freq > 0) {
            setTimeout(() => {
                playSound(note.freq, note.dur, 'square', 0.1);
            }, timeOffset * 1000);
        }
        timeOffset += note.dur; 
    });
}

function initAudio() {
    if (isAudioInit) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isAudioInit = true;
}

function playSound(freq, duration, type = 'square', volume = 0.1) {
    if (!audioCtx || freq === 0) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; 
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playStartSound() {
    const melody = [
        { freq: 392.00, dur: 0.13 },
        { freq: 523.25, dur: 0.13 },        
        { freq: 659.26, dur: 0.13},
        { freq: 784.00, dur: 0.13 },
        { freq: 1046.50, dur: 0.13 }
    ];
    playMelody(melody);
}

function playClearSound() {
    const notes = [587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
    notes.forEach((f, i) => {
        let d = (i === notes.length - 1) ? 0.6 : 0.08;
        setTimeout(() => playSound(f, d, 'square',0.1), i * 80);
    });
}

function playDeadSound() {
    playSound(880, 0.1, 'sawtooth', 0.12);
    setTimeout(() => playSound(587, 0.1, 'sawtooth', 0.08), 70);
    setTimeout(() => {
        if (!audioCtx) return;   
        let now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.5);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.0001, now + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.5);
    }, 140);
}

function gameOver() {
    if (gameState === "GAMEOVER") return; 
    gameState = "GAMEOVER";
    playDeadSound();   
    setTimeout(() => { playGameOverSound(); }, 500);
}

                else if(char === "b") ctx.fillStyle = "#000000"; 
            }
            else if (type === "enemy") {
                if(char === "k") ctx.fillStyle = "#00008b";      
                else if(char === "p") ctx.fillStyle = "#00ffff"; 
                else if(char === "b") ctx.fillStyle = "#000000"; 
            }
            else if (type === "block") {
                if(char === "3") ctx.fillStyle = "#00008b";      
                else if(char === "2") ctx.fillStyle = "#0000ff"; 
                else if(char === "1") ctx.fillStyle = "#00ffff"; 
            }
            else if (type === "wall") {
                if(char === "3") ctx.fillStyle = "#4a2211";      
                else if(char === "2") ctx.fillStyle = "#7a3e20"; 
                else if(char === "1") ctx.fillStyle = "#a85d38"; 
                else if(char === "9") ctx.fillStyle = "#2b140a"; 
            }
            else if (type === "carrot") {
                if(char === "5") ctx.fillStyle = "#006400";      
                else if(char === "4") ctx.fillStyle = "#32cd32"; 
                else if(char === "3") ctx.fillStyle = "#8b4513"; 
                else if(char === "2") ctx.fillStyle = "#ff8c00"; 
            }
            else if (type === "house") {
                if(char === "4") ctx.fillStyle = "#5c2e16";      
                else if(char === "3") ctx.fillStyle = "#d32f2f"; 
                else if(char === "2") ctx.fillStyle = "#fbc02d"; 
                else if(char === "1") ctx.fillStyle = "#29b6f6"; 
            }
            ctx.fillRect(pixelX + c * pixelSize, pixelY + r * pixelSize, pixelSize, pixelSize);
        }
    }
}

let map = Array(MAP_ROWS).fill().map(() => Array(MAP_COLS).fill(0));

// 見たままのマップデータをそのまま解析
function parseTextMap(stageLines) {
    for(let y=0; y<MAP_ROWS; y++) for(let x=0; x<MAP_COLS; x++) map[y][x] = 0;
    
    for (let y = 0; y < MAP_ROWS; y++) {
        const line = stageLines[y] || "..........."; 
        for (let x = 0; x < MAP_COLS; x++) {
            const char = line[x] || ".";
            if (char === "#") map[y][x] = 1;
            else if (char === "B") map[y][x] = 2;
            else if (char === "C") map[y][x] = 3;
            else if (char === "P") { 
                player = { x: x, y: y }; 
                playerDrawX = x * TILE_SIZE; 
                playerDrawY = y * TILE_SIZE;
            }
            else if (char === "E") {
                enemy = { x: x, y: y };
                enemyDrawX = x * TILE_SIZE;
                enemyDrawY = y * TILE_SIZE;
                enemyDir = (round % 3 === 0) ? 2 : (round % 2 === 0) ? 3 : 1; 
            }
            else if (char === "G") { goalX = x; goalY = y; map[y][x] = 9; }
        }
    }
}

function getRemainingCarrotCount() {
    let count = 0;
    for (let y = 0; y < MAP_ROWS; y++) {
        for (let x = 0; x < MAP_COLS; x++) {
            if (map[y][x] === 3) count++;
        }
    }
    return count;
}

function initTitleScreen() {
    gameState = "TITLE";
    document.getElementById("btn-giveup").style.display = "none"; 
    resetGiveUp();
    if(gameTimer) clearInterval(gameTimer);
    if(titleTimer) clearInterval(titleTimer);
    titleTimer = setInterval(() => { if(gameState === "TITLE") { blinkState = !blinkState; } }, 400);
}

function startGame() {
    if (gameState === "INSTRUCTIONS") return; 
    if(titleTimer) clearInterval(titleTimer);
    initAudio();
    round = selectedRound; score = 0;
    document.getElementById("score").innerText = score;
    initStage();
}

function initStage() {
    if(gameTimer) clearInterval(gameTimer); 
    const stageLines = STAGES[round] || STAGES[1];
    parseTextMap(stageLines);
    document.getElementById("round").innerText = round;
    gameState = "START_READY"; readyTimerCount = 0; blinkState = true;
    
    document.getElementById("btn-giveup").style.display = "flex"; 
    resetGiveUp();
    playStartSound();

    gameTimer = setInterval(() => {
        if (gameState === "START_READY") {
            readyTimerCount++;
            if (readyTimerCount >= 6) { 
                gameState = "PLAYING"; 
            }
        } else if (gameState === "PLAYING") {
            updateEnemy();
        } else if (gameState === "STAGE_CLEAR_PERFORM") {
            clearTimerCount++;
            if (clearTimerCount >= 10) { round++; if(!STAGES[round]) round = 1; initStage(); }
        } else if (gameState === "GAMEOVER_PERFORM") {
            blinkState = !blinkState; 
        } else if (gameState === "GAMEOVER_BLINKING") {
            readyTimerCount++; blinkState = !blinkState; 
            if (readyTimerCount >= 8) initTitleScreen();
        }
    }, 250);
}

function triggerGameOver() {
    if (gameState === "GAMEOVER_PERFORM" || gameState === "GAMEOVER_BLINKING") return; 
    gameState = "GAMEOVER_PERFORM"; 
    document.getElementById("btn-giveup").style.display = "none"; 
    resetGiveUp();
    playDeadSound();
    
    setTimeout(() => {
        playGameOverSound(); 
        gameState = "GAMEOVER_BLINKING"; 
        readyTimerCount = 0; 
        blinkState = true;
    }, 1000); 
}

function updateEnemy() {
    if (gameState !== "PLAYING") return; 
    let dx = 0, dy = 0;
    if (enemyDir === 0) dy = -1; if (enemyDir === 1) dx = 1; if (enemyDir === 2) dy = 1; if (enemyDir === 3) dx = -1;
    let nextX = enemy.x + dx; let nextY = enemy.y + dy;
    let isBlocked = false;
    
    if (nextX < 0 || nextX >= MAP_COLS || nextY < 0 || nextY >= MAP_ROWS) {
        isBlocked = true;
    } else {
        let checkTile = map[nextY][nextX];
        if (checkTile === 1 || checkTile === 2) {
            isBlocked = true;
        }
        else if (checkTile === 9 && getRemainingCarrotCount() > 0) {
            isBlocked = false; 
        }
    }

    if (!isBlocked) {
        enemy.x = nextX; enemy.y = nextY;
        if (map[enemy.y][enemy.x] === 3) {
            map[enemy.y][enemy.x] = 0; score += 500; 
            document.getElementById("score").innerText = score;
            playSound(600, 0.05, 'triangle', 0.1);
            setTimeout(() => playSound(800, 0.05, 'triangle', 0.1), 50);
            setTimeout(() => playSound(1000, 0.1, 'triangle', 0.1), 100);
        }
    } else { 
        enemyDir = (enemyDir + 1) % 4; 
    }

    if (map[enemy.y][enemy.x] === 9 && getRemainingCarrotCount() === 0) {
        document.getElementById("btn-giveup").style.display = "none";
        playClearSound(); gameState = "STAGE_CLEAR_PERFORM"; clearTimerCount = 0;
        return;
    }
    
    if (enemy.x === player.x && enemy.y === player.y) {
        triggerGameOver();
    }
}

function renderLoop() {
    requestAnimationFrame(renderLoop);
    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (gameState === "TITLE" || gameState === "INSTRUCTIONS") {
        ctx.fillStyle = "#0d0d11"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffcc00"; ctx.font = "bold 44px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("BONX BANX", canvas.width / 2, 140);
        ctx.fillStyle = "#00ffff"; ctx.font = "bold 20px 'Courier New'";
        ctx.fillText(`STAGE SELECT: < ROUND ${selectedRound} >`, canvas.width / 2, 230);
        ctx.fillStyle = "#ffffff"; ctx.font = "16px 'Courier New'";
        if (blinkState && gameState === "TITLE") ctx.fillText("TAP OR TRACE TO START", canvas.width / 2, 290);
        ctx.fillStyle = "#ffff00"; ctx.font = "16px 'Courier New'";
        ctx.fillText("左右なぞりでステージ選択", canvas.width / 2, 330);
        ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Courier New'";
        ctx.fillText("mokuyoshi", canvas.width / 2, 400);
        return;
    }

    // 外壁を描画しない (x=1~9, y=1~15)
    for (let y = 1; y < MAP_ROWS - 1; y++) {
        for (let x = 1; x < MAP_COLS - 1; x++) {
            let px = (x - 1) * TILE_SIZE; 
            let py = (y - 1) * TILE_SIZE;
            
            if (map[y][x] === 1) drawCustomArt(px, py, "wall");
            else if (map[y][x] === 3) drawCustomArt(px, py, "carrot");
            else if (map[y][x] === 2) drawCustomArt(px, py, "block");
            else if (map[y][x] === 9) drawCustomArt(px, py, "house");
        }
    }

    playerDrawX += (player.x * TILE_SIZE - playerDrawX) * 0.4;
    playerDrawY += (player.y * TILE_SIZE - playerDrawY) * 0.4;
    enemyDrawX += (enemy.x * TILE_SIZE - enemyDrawX) * 0.3;
    enemyDrawY += (enemy.y * TILE_SIZE - enemyDrawY) * 0.3;

    let isBlinking = (gameState === "GAMEOVER_BLINKING" || gameState === "GAMEOVER_PERFORM");
    
    drawCustomArt(enemyDrawX - TILE_SIZE, enemyDrawY - TILE_SIZE, "enemy", isBlinking);
    drawCustomArt(playerDrawX - TILE_SIZE, playerDrawY - TILE_SIZE, "player", isBlinking);
    
    if (gameState === "START_READY") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 160, canvas.width, 120);
        ctx.fillStyle = "#00ffff"; ctx.font = "bold 36px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText(`ROUND ${round}`, canvas.width / 2, 215);
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px 'Courier New'"; ctx.fillText("READY?", canvas.width / 2, 250);
    }
    if (gameState === "STAGE_CLEAR_PERFORM") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 160, canvas.width, 120);
        ctx.fillStyle = "#ffcc00"; ctx.font = "bold 36px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("STAGE CLEAR !!", canvas.width / 2, 230);
    }
    if (gameState === "GAMEOVER_BLINKING") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.fillRect(0, 160, canvas.width, 120);
        ctx.fillStyle = "#cc0000"; ctx.font = "bold 44px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, 230);
    }
}

function handleTitleInput(dir) {
    if (dir === "left") {
        selectedRound--; if (selectedRound < 1) selectedRound = 10;
        playSound(440, 0.05, 'square');
    } else if (dir === "right") {
        selectedRound++; if (selectedRound > 10) selectedRound = 1;
        playSound(440, 0.05, 'square');
    } else if (dir === "up" || dir === "down") {
        startGame();
    }
}

window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (gameState === "TITLE") {
        if (e.key === "ArrowLeft") handleTitleInput("left");
        else if (e.key === "ArrowRight") handleTitleInput("right");
        else if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") handleTitleInput("up");
        return;
    }
    if (gameState !== "PLAYING") return;
    if (e.key === "ArrowUp") movePlayer(0, -1);
    else if (e.key === "ArrowDown") movePlayer(0, 1);
    else if (e.key === "ArrowLeft") movePlayer(-1, 0);
    else if (e.key === "ArrowRight") movePlayer(1, 0);
});

function movePlayer(dx, dy) {
    let nextX = player.x + dx; let nextY = player.y + dy;
    if (nextX < 0 || nextX >= MAP_COLS || nextY < 0 || nextY >= MAP_ROWS) return;
    let tile = map[nextY][nextX];
    
    if (tile === 1) return; 
    if (tile === 2) { 
        let pushX = nextX + dx; let pushY = nextY + dy;
        if (pushX < 0 || pushX >= MAP_COLS || pushY < 0 || pushY >= MAP_ROWS) return;
        if (map[pushY][pushX] === 0) { 
            map[nextY][nextX] = 0; map[pushY][pushX] = 2;
           playSound(400, 0.04, 'triangle', 0.06);
        } else {
            return;
        }
    }
    
    player.x = nextX; player.y = nextY;
    playSound(400, 0.02, 'square', 0.1); 
    
    if (player.x === enemy.x && player.y === enemy.y) {
        triggerGameOver();
    }
}

// スマホ用「なぞり」操作
let currentTouchX = 0;
let currentTouchY = 0;
const TRACE_THRESHOLD = 35; 

canvas.addEventListener("touchstart", (e) => {
    initAudio();
    if (e.touches.length > 0) {
        currentTouchX = e.touches[0].clientX;
        currentTouchY = e.touches[0].clientY;
        if (gameState === "TITLE") {
            startGame();
        }
    }
}, {passive: false});

canvas.addEventListener("touchmove", (e) => {
    e.preventDefault(); 
    if (gameState !== "PLAYING" || e.touches.length === 0) return;

    let touchX = e.touches[0].clientX;
    let touchY = e.touches[0].clientY;
    
    let dx = touchX - currentTouchX;
    let dy = touchY - currentTouchY;
    
    if (Math.abs(dx) >= TRACE_THRESHOLD || Math.abs(dy) >= TRACE_THRESHOLD) {
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) movePlayer(1, 0); 
            else movePlayer(-1, 0);       
        } else {
            if (dy > 0) movePlayer(0, 1); 
            else movePlayer(0, -1);       
        }
        currentTouchX = touchX;
        currentTouchY = touchY;
    }
}, {passive: false});

// ギブアップ
const btnGiveUp = document.getElementById("btn-giveup");
function startGiveUp(e) {
    if (e) e.preventDefault();
    if (gameState !== "PLAYING" && gameState !== "START_READY") return;
    initAudio();
    giveUpStartTime = Date.now();
    giveUpProgress = 0;
    if(giveUpTimer) clearInterval(giveUpTimer);
    giveUpTimer = setInterval(() => {
        let elapsed = Date.now() - giveUpStartTime;
        giveUpProgress = Math.min(100, Math.floor((elapsed / GIVEUP_DURATION) * 100));
        btnGiveUp.innerHTML = `ギブアップ<br>[ ${giveUpProgress}% ]`;
        
        if (giveUpProgress % 15 === 0 && giveUpProgress < 100) {
            playSound(200 + (giveUpProgress * 3), 0.04, 'square', 0.03);
        }
        if (elapsed >= GIVEUP_DURATION) {
            clearInterval(giveUpTimer);
            triggerGiveUp();
        }
    }, 50);
}
function cancelGiveUp(e) {
    if (e) e.preventDefault();
    resetGiveUp();
}
function resetGiveUp() {
    if(giveUpTimer) clearInterval(giveUpTimer);
    giveUpTimer = null;
    giveUpProgress = 0;
    btnGiveUp.innerHTML = "ギブアップ<br>長押し";
}
function triggerGiveUp() {
    resetGiveUp();
    triggerGameOver(); 
}
btnGiveUp.addEventListener("touchstart", startGiveUp, { passive: false });
btnGiveUp.addEventListener("touchend", cancelGiveUp, { passive: false });
btnGiveUp.addEventListener("touchcancel", cancelGiveUp, { passive: false });
btnGiveUp.addEventListener("mousedown", startGiveUp);
btnGiveUp.addEventListener("mouseup", cancelGiveUp);
btnGiveUp.addEventListener("mouseleave", cancelGiveUp);

// 説明画面
const btnInst = document.getElementById("btn-instructions");
const btnCloseInst = document.getElementById("btn-close-instructions");
const instScreen = document.getElementById("instructions-screen");

btnInst.addEventListener("click", (e) => {
    e.stopPropagation();
    initAudio();
    if (gameState === "TITLE") {
        gameState = "INSTRUCTIONS";
        instScreen.style.display = "flex";
        btnInst.style.display = "none";
        playSound(600, 0.05, 'square');
    }
});

btnCloseInst.addEventListener("click", (e) => {
    e.stopPropagation();
    if (gameState === "INSTRUCTIONS") {
        gameState = "TITLE";
        instScreen.style.display = "none";
        btnInst.style.display = "block";
        playSound(440, 0.05, 'square');
    }
});

initTitleScreen();
renderLoop(); 
</script>
