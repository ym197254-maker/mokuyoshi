<!DOCTYPE html>
<html lang="ja">

    <style>

        /* --- 全体のレイアウト設定（限界まで余白を削る） --- */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #2b2b36;
            color: #f0f0f0;
            font-family: 'Kosugi Maru', 'Courier New', monospace;
            text-align: center;
            height: 100%;
            overflow: hidden; 
            touch-action: none; 
            overscroll-behavior: none; 
        }

        #game-container {
            width: 100%;
            height: 100dvh; 
            max-width: 600px; 
            margin: 0 auto;
            box-sizing: border-box;
            padding: 4px; 
            display: flex;
            flex-direction: column; 
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* --- HUD (スコア表示など) --- */
        #hud {
            flex-shrink: 0; 
            display: flex;

            border-radius: 8px;

            border: 2px solid #444455;
            color: #ffeb3b;
        }

        /* --- キャンバス（パズル画面）のラッパー --- */
        #canvas-wrapper {
            flex-grow: 1; 
            width: 100%;
            margin-bottom: 6px; 
            position: relative;
            display: flex;
            align-items: center; 
            justify-content: center; 
            min-height: 0;
        }

        canvas {
            background-color: #0d0d11;
            border: 4px solid #3a2211; 
            border-radius: 10px;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 352 / 480; 
            display: block;
            image-rendering: pixelated;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            box-sizing: border-box;
            touch-action: none;
        }

        /* --- タイトル画面UI --- */
        #title-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            max-width: 352px;
            max-height: 480px;
            background: linear-gradient(135deg, rgba(30,30,40,0.95), rgba(20,20,30,0.95));

        #round-display { font-family: 'Fredoka One', cursive; font-size: 18px; color: #1dd1a1; }

        /* --- ポップなボタン --- */
        .pop-btn { font-family: 'Fredoka One', 'Kosugi Maru', sans-serif; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; touch-action: manipulation; transition: all 0.1s; }
        .pop-btn:active { transform: translateY(3px); }
        .small-btn { background: #54a0ff; color: #fff; width: 36px; height: 36px; font-size: 16px; border-radius: 50%; box-shadow: 0 4px 0 #2e86de; }
        .small-btn:active { box-shadow: 0 0px 0 #2e86de; }
        .large-btn { background: #ff9f43; color: #fff; width: 100%; padding: 12px 0; font-size: 20px; border-radius: 25px; box-shadow: 0 5px 0 #f368e0, 0 8px 15px rgba(0,0,0,0.3); margin-top: 5px; text-shadow: 1px 1px 0 rgba(0,0,0,0.2); }
        .large-btn:active { box-shadow: 0 1px 0 #f368e0; }
        .sub-btn { background: #10ac84; color: #fff; padding: 10px; font-size: 13px; box-shadow: 0 4px 0 #01a3a4; width: 100%; }
        .sub-btn:active { box-shadow: 0 0px 0 #01a3a4; }
        .danger-btn { background: #ff6b6b; color: #fff; padding: 10px; font-size: 13px; box-shadow: 0 4px 0 #ee5253; width: 100%; display: flex; align-items: center; justify-content: center; line-height: 1.2; }

        #author-text { margin-top: 15px; font-size: 11px; color: #a4b0be; }

        /* --- 下部アクションコンテナ --- */
        #action-container { flex-shrink: 0; display: flex; gap: 8px; width: 100%; justify-content: center; margin-bottom: 2px; }

        /* --- 説明画面 --- */
        #instructions-screen { position: absolute; top: 5%; left: 5%; right: 5%; bottom: 5%; background-color: rgba(47, 53, 66, 0.95); border: 4px solid #1dd1a1; border-radius: 12px; z-index: 10; box-sizing: border-box; padding: 16px; text-align: left; box-shadow: 0 0 20px rgba(29, 209, 161, 0.4); display: flex; flex-direction: column; }
        #instructions-title { color: #1dd1a1; font-size: 18px; font-weight: bold; text-align: center; margin-top: 0; margin-bottom: 10px; border-bottom: 2px dashed #1dd1a1; padding-bottom: 6px; font-family: 'Fredoka One', cursive; }
        #instructions-text { font-size: 13px; line-height: 1.5; color: #ffffff; overflow-y: auto; flex-grow: 1; margin-bottom: 10px; padding-right: 4px; }
        #instructions-text b { color: #ffeb3b; }
    </style>
</head>

<div id="game-container">
    <div id="hud" style="display: none;">
        <div>SCORE: <span id="score">0</span></div>

    </div>

            <div id="title-ui">

                    <span id="round-display">ROUND 1</span>
                    <button id="btn-next" class="pop-btn small-btn">▶</button>
                </div>
                <button id="btn-start" class="pop-btn large-btn">GAME START</button>
                <button id="btn-title-inst" class="pop-btn sub-btn" style="margin-top:5px; width:80%;">HOW TO PLAY</button>
            </div>
            <div id="author-text">mokuyoshi</div>
        </div>

        <div id="instructions-screen" style="display: none;">
            <div id="instructions-title">HOW TO PLAY</div>
            <div id="instructions-text">
                <b>【目的】</b><br>
                バンクス君を誘導して、すべてのニンジンを回収させ家へ導こう！<br><br>
                <b>【ルール】</b><br>
                ・すべてのニンジンを回収させないと、バンクス君は家に入れません。<br>
                ・バンクス君は直進を続け、壁や青ブロックにぶつかると右に曲がります。<br><br>
                <b>【基本操作】</b><br>
                ・画面を<b>なぞって（ドラッグして）</b>プレイヤーを移動させます。<br>
                ・青ブロックを押して、バンクス君の進行ルートをコントロールしよう！<br><br>
                ・ギブアップはボタンを長押しで作動します。
            </div>
            <button id="btn-close-instructions" class="pop-btn sub-btn">戻る (BACK)</button>
        </div>
    </div>
    
    <div id="action-container" style="display: none;">
        <div id="btn-giveup" class="pop-btn danger-btn" style="width: 100%; max-width: 300px;">ギブアップ<br>長押し</div>

    images[key].crossOrigin = "anonymous";

}

// 安全に画像をドット絵として描画する関数
function safeDrawImage(img, x, y, size) {
    if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, x, y, size, size);
    } else {
        // 画像がロードされていない時のための簡易的なバックアップ描画（読み込み完了すれば画像に切り替わります）
        ctx.fillStyle = "#444";
        ctx.fillRect(x, y, size, size);
    }
}

function drawImageBlinking(img, x, y, size, blink) {
    if (blink && !blinkState) return;
    safeDrawImage(img, x, y, size);
}

function playMelody(melodyArray) {
    let timeOffset = 0; 
    melodyArray.forEach((note) => {
        if (note.freq > 0) {
            setTimeout(() => {
                playSound(note.freq, note.dur, 'square', 0.1);
            }, timeOffset * 1000);
        }
        timeOffset += note.dur; 
    });
}

function initAudio() {
    if (isAudioInit) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isAudioInit = true;
}

function playSound(freq, duration, type = 'square', volume = 0.1) {
    if (!audioCtx || freq === 0) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; 
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playStartSound() {
    const melody = [
        { freq: 392.00, dur: 0.13 }, { freq: 523.25, dur: 0.13 },        
        { freq: 659.26, dur: 0.13}, { freq: 784.00, dur: 0.13 }, { freq: 1046.50, dur: 0.13 }
    ];
    playMelody(melody);
}

function playClearSound() {
    const notes = [587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
    notes.forEach((f, i) => {
        let d = (i === notes.length - 1) ? 0.6 : 0.08;
        setTimeout(() => playSound(f, d, 'square',0.1), i * 80);
    });
}

function playDeadSound() {
    playSound(880, 0.1, 'sawtooth', 0.12);
    setTimeout(() => playSound(587, 0.1, 'sawtooth', 0.08), 70);
    setTimeout(() => {
        if (!audioCtx) return;   
        let now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.5);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.0001, now + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.5);
    }, 140);
}

function playGameOverSound() {
    const notes = [392.00, 349.23, 311.13, 293.66, 261.63, 196.00];
    notes.forEach((f, i) => {
        let d = (i === notes.length - 1) ? 0.8 : 0.15;
        setTimeout(() => playSound(f, d, 'square', 0.08), i * 140);
    });
}

let map = Array(MAP_ROWS).fill().map(() => Array(MAP_COLS).fill(0));

function parseTextMap(stageLines) {
    for(let y=0; y<MAP_ROWS; y++) for(let x=0; x<MAP_COLS; x++) map[y][x] = 0;
    
    for (let y = 0; y < MAP_ROWS; y++) {
        const line = stageLines[y] || "..........."; 
        for (let x = 0; x < MAP_COLS; x++) {
            const char = line[x] || ".";
            if (char === "#") map[y][x] = 1;
            else if (char === "B") map[y][x] = 2;
            else if (char === "C") map[y][x] = 3;
            else if (char === "P") { 
                player = { x: x, y: y }; 
                playerDrawX = x * TILE_SIZE; 
                playerDrawY = y * TILE_SIZE;
            }
            else if (char === "E") {
                enemy = { x: x, y: y };
                enemyDrawX = x * TILE_SIZE;
                enemyDrawY = y * TILE_SIZE;
                enemyDir = (round % 3 === 0) ? 2 : (round % 2 === 0) ? 3 : 1; 
            }
            else if (char === "G") { goalX = x; goalY = y; map[y][x] = 9; }
        }
    }
}

function getRemainingCarrotCount() {
    let count = 0;
    for (let y = 0; y < MAP_ROWS; y++) {
        for (let x = 0; x < MAP_COLS; x++) {
            if (map[y][x] === 3) count++;
        }
    }
    return count;
}

// === タイトルボタン操作 ===
document.getElementById("btn-start").onclick = () => {
    initAudio();
    if (gameState === "TITLE") startGame();
};
document.getElementById("btn-prev").onclick = () => {
    initAudio();
    selectedRound = selectedRound > 1 ? selectedRound - 1 : 10;
    document.getElementById("round-display").innerText = "ROUND " + selectedRound;
    playSound(440, 0.05, 'square');
};
document.getElementById("btn-next").onclick = () => {
    initAudio();
    selectedRound = selectedRound < 10 ? selectedRound + 1 : 1;
    document.getElementById("round-display").innerText = "ROUND " + selectedRound;
    playSound(440, 0.05, 'square');
};

function initTitleScreen() {
    gameState = "TITLE";
    document.getElementById("title-screen").style.display = "flex";
    document.getElementById("hud").style.display = "none";
    document.getElementById("action-container").style.display = "none";
    resetGiveUp();
    if(gameTimer) clearInterval(gameTimer);
    if(titleTimer) clearInterval(titleTimer);
    titleTimer = setInterval(() => { if(gameState === "TITLE") { blinkState = !blinkState; } }, 400);
}

function startGame() {
    if(titleTimer) clearInterval(titleTimer);
    initAudio();
    round = selectedRound; score = 0;
    document.getElementById("score").innerText = score;
    
    document.getElementById("title-screen").style.display = "none";
    document.getElementById("hud").style.display = "flex";
    document.getElementById("action-container").style.display = "flex";
    
    initStage();
}

function initStage() {
    if(gameTimer) clearInterval(gameTimer); 
    const stageLines = STAGES[round] || STAGES[1];
    parseTextMap(stageLines);
    document.getElementById("round").innerText = round;
    gameState = "START_READY"; readyTimerCount = 0; blinkState = true;
    
    resetGiveUp();
    playStartSound();

    gameTimer = setInterval(() => {
        if (gameState === "START_READY") {
            readyTimerCount++;
            if (readyTimerCount >= 6) { 
                gameState = "PLAYING"; 
            }
        } else if (gameState === "PLAYING") {
            updateEnemy();
        } else if (gameState === "STAGE_CLEAR_PERFORM") {
            clearTimerCount++;
            if (clearTimerCount >= 10) { round++; if(!STAGES[round]) round = 1; initStage(); }
        } else if (gameState === "GAMEOVER_PERFORM") {
            blinkState = !blinkState; 
        } else if (gameState === "GAMEOVER_BLINKING") {
            readyTimerCount++; blinkState = !blinkState; 
            if (readyTimerCount >= 8) initTitleScreen();
        }
    }, 250);
}

function triggerGameOver() {
    if (gameState === "GAMEOVER_PERFORM" || gameState === "GAMEOVER_BLINKING") return; 
    gameState = "GAMEOVER_PERFORM"; 
    document.getElementById("action-container").style.display = "none"; 
    resetGiveUp();
    playDeadSound();
    
    setTimeout(() => {
        playGameOverSound(); 
        gameState = "GAMEOVER_BLINKING"; 
        readyTimerCount = 0; 
        blinkState = true;
    }, 1000); 
}

function updateEnemy() {
    if (gameState !== "PLAYING") return; 
    let dx = 0, dy = 0;
    if (enemyDir === 0) dy = -1; if (enemyDir === 1) dx = 1; if (enemyDir === 2) dy = 1; if (enemyDir === 3) dx = -1;
    let nextX = enemy.x + dx; let nextY = enemy.y + dy;
    let isBlocked = false;
    
    if (nextX < 0 || nextX >= MAP_COLS || nextY < 0 || nextY >= MAP_ROWS) {
        isBlocked = true;
    } else {
        let checkTile = map[nextY][nextX];
        if (checkTile === 1 || checkTile === 2) {
            isBlocked = true;
        }
        else if (checkTile === 9 && getRemainingCarrotCount() > 0) {
            isBlocked = false; 
        }
    }

    if (!isBlocked) {
        enemy.x = nextX; enemy.y = nextY;
        if (map[enemy.y][enemy.x] === 3) {
            map[enemy.y][enemy.x] = 0; score += 500; 
            document.getElementById("score").innerText = score;
            playSound(600, 0.05, 'triangle', 0.1);
            setTimeout(() => playSound(800, 0.05, 'triangle', 0.1), 50);
            setTimeout(() => playSound(1000, 0.1, 'triangle', 0.1), 100);
        }
    } else { 
        enemyDir = (enemyDir + 1) % 4; 
    }

    if (map[enemy.y][enemy.x] === 9 && getRemainingCarrotCount() === 0) {
        document.getElementById("action-container").style.display = "none";
        playClearSound(); gameState = "STAGE_CLEAR_PERFORM"; clearTimerCount = 0;
        return;
    }
    
    if (enemy.x === player.x && enemy.y === player.y) {
        triggerGameOver();
    }
}

function renderLoop() {
    requestAnimationFrame(renderLoop);
    draw();
}

function draw() {
    if (gameState === "TITLE" || gameState === "INSTRUCTIONS") {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 背景を暗く塗りつぶす
    ctx.fillStyle = "#0d0d11";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // マップ上のブロック・壁・ニンジンの描画
    for (let y = 0; y < MAP_ROWS; y++) {
        for (let x = 0; x < MAP_COLS; x++) {
            let px = x * TILE_SIZE; 
            let py = y * TILE_SIZE;
            
            if (map[y][x] === 1) safeDrawImage(images.wall, px, py, TILE_SIZE);
            else if (map[y][x] === 3) safeDrawImage(images.carrot, px, py, TILE_SIZE);
            else if (map[y][x] === 2) safeDrawImage(images.block, px, py, TILE_SIZE);
            else if (map[y][x] === 9) safeDrawImage(images.house, px, py, TILE_SIZE);
        }
    }

    // 滑らかな移動演出のための補間計算
    playerDrawX += (player.x * TILE_SIZE - playerDrawX) * 0.4;
    playerDrawY += (player.y * TILE_SIZE - playerDrawY) * 0.4;
    enemyDrawX += (enemy.x * TILE_SIZE - enemyDrawX) * 0.3;
    enemyDrawY += (enemy.y * TILE_SIZE - enemyDrawY) * 0.3;

    let isBlinking = (gameState === "GAMEOVER_BLINKING" || gameState === "GAMEOVER_PERFORM");
    
    // キャラクターの描画
    drawImageBlinking(images.enemy, enemyDrawX, enemyDrawY, TILE_SIZE, isBlinking);
    drawImageBlinking(images.player, playerDrawX, playerDrawY, TILE_SIZE, isBlinking);
    
    // UIテキストオーバーレイ
    if (gameState === "START_READY") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 160, canvas.width, 100);
        ctx.fillStyle = "#00ffff"; ctx.font = "bold 36px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText(`ROUND ${round}`, canvas.width / 2, 205);
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px 'Courier New'"; ctx.fillText("READY?", canvas.width / 2, 240);
    }
    if (gameState === "STAGE_CLEAR_PERFORM") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 160, canvas.width, 100);
        ctx.fillStyle = "#ffcc00"; ctx.font = "bold 36px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("STAGE CLEAR !!", canvas.width / 2, 220);
    }
    if (gameState === "GAMEOVER_BLINKING") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.fillRect(0, 160, canvas.width, 100);
        ctx.fillStyle = "#cc0000"; ctx.font = "bold 44px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, 220);
    }
}

window.addEventListener("keydown", (e) => {
    if (e.repeat) return;
    if (gameState !== "PLAYING") return;
    if (e.key === "ArrowUp") movePlayer(0, -1);
    else if (e.key === "ArrowDown") movePlayer(0, 1);
    else if (e.key === "ArrowLeft") movePlayer(-1, 0);
    else if (e.key === "ArrowRight") movePlayer(1, 0);
});

function movePlayer(dx, dy) {
    let nextX = player.x + dx; let nextY = player.y + dy;
    if (nextX < 0 || nextX >= MAP_COLS || nextY < 0 || nextY >= MAP_ROWS) return;
    let tile = map[nextY][nextX];
    
    if (tile === 1) return; 
    if (tile === 2) { 
        let pushX = nextX + dx; let pushY = nextY + dy;
        if (pushX < 0 || pushX >= MAP_COLS || pushY < 0 || pushY >= MAP_ROWS) return;
        if (map[pushY][pushX] === 0) { 
            map[nextY][nextX] = 0; map[pushY][pushX] = 2;
           playSound(400, 0.04, 'triangle', 0.06);
        } else {
            return;
        }
    }
    
    player.x = nextX; player.y = nextY;
    playSound(400, 0.02, 'square', 0.1); 
    
    if (player.x === enemy.x && player.y === enemy.y) {
        triggerGameOver();
    }
}

// === スマホ用「なぞり」操作 ===
let currentTouchX = 0;
let currentTouchY = 0;
const TRACE_THRESHOLD = 35; 

canvas.addEventListener("touchstart", (e) => {
    initAudio();
    if (e.touches.length > 0) {
        currentTouchX = e.touches[0].clientX;
        currentTouchY = e.touches[0].clientY;
    }
}, {passive: false});

canvas.addEventListener("touchmove", (e) => {
    e.preventDefault(); 
    if (gameState !== "PLAYING" || e.touches.length === 0) return;

    let touchX = e.touches[0].clientX;
    let touchY = e.touches[0].clientY;
    
    let dx = touchX - currentTouchX;
    let dy = touchY - currentTouchY;
    
    if (Math.abs(dx) >= TRACE_THRESHOLD || Math.abs(dy) >= TRACE_THRESHOLD) {
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 0) movePlayer(1, 0); 
            else movePlayer(-1, 0);       
        } else {
            if (dy > 0) movePlayer(0, 1); 
            else movePlayer(0, -1);       
        }
        currentTouchX = touchX;
        currentTouchY = touchY;
    }
}, {passive: false});

// === ギブアップ ===
const btnGiveUp = document.getElementById("btn-giveup");
function startGiveUp(e) {
    if (e) e.preventDefault();
    if (gameState !== "PLAYING" && gameState !== "START_READY") return;
    initAudio();
    giveUpStartTime = Date.now();
    giveUpProgress = 0;
    if(giveUpTimer) clearInterval(giveUpTimer);
    giveUpTimer = setInterval(() => {
        let elapsed = Date.now() - giveUpStartTime;
        giveUpProgress = Math.min(100, Math.floor((elapsed / GIVEUP_DURATION) * 100));
        btnGiveUp.innerHTML = `ギブアップ<br>[ ${giveUpProgress}% ]`;
        
        if (giveUpProgress % 15 === 0 && giveUpProgress < 100) {
            playSound(200 + (giveUpProgress * 3), 0.04, 'square', 0.03);
        }
        if (elapsed >= GIVEUP_DURATION) {
            clearInterval(giveUpTimer);
            triggerGiveUp();
        }
    }, 50);
}
function cancelGiveUp(e) {
    if (e) e.preventDefault();
    resetGiveUp();
}
function resetGiveUp() {
    if(giveUpTimer) clearInterval(giveUpTimer);
    giveUpTimer = null;
    giveUpProgress = 0;
    btnGiveUp.innerHTML = "ギブアップ<br>長押し";
}
function triggerGiveUp() {
    resetGiveUp();
    triggerGameOver(); 
}
btnGiveUp.addEventListener("touchstart", startGiveUp, { passive: false });
btnGiveUp.addEventListener("touchend", cancelGiveUp, { passive: false });
btnGiveUp.addEventListener("touchcancel", cancelGiveUp, { passive: false });
btnGiveUp.addEventListener("mousedown", startGiveUp);
btnGiveUp.addEventListener("mouseup", cancelGiveUp);
btnGiveUp.addEventListener("mouseleave", cancelGiveUp);

// === 説明画面 ===
const btnTitleInst = document.getElementById("btn-title-inst");
const btnCloseInst = document.getElementById("btn-close-instructions");
const instScreen = document.getElementById("instructions-screen");

function openInstructions(e) {
    e.stopPropagation();
    initAudio();
    if (gameState === "TITLE") {
        gameState = "INSTRUCTIONS";
        instScreen.style.display = "flex";
        playSound(600, 0.05, 'square');
    }
}
btnTitleInst.addEventListener("click", openInstructions);

btnCloseInst.addEventListener("click", (e) => {
    e.stopPropagation();
    if (gameState === "INSTRUCTIONS") {
        gameState = "TITLE";
        instScreen.style.display = "none";
        playSound(440, 0.05, 'square');
    }
});

// 完全なズーム防止策
document.addEventListener('dblclick', function(e) {
    e.preventDefault();
}, { passive: false });

document.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) { 
        e.preventDefault();
    }
}, { passive: false });

let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
    let now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) { 
        e.preventDefault();
    }
    lastTouchEnd = now;
}, { passive: false });

initTitleScreen();
renderLoop(); 
</script>
