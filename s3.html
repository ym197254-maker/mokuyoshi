<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>スーパーレジパズル</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        h2 {
            margin: 5px 0;
            font-size: 16px;
        }
        canvas {
            border: 2px solid #555;
            background-color: #1a1a2e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 15px;
        }
        button {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        button:active {
            background-color: #d35400;
            transform: translateY(2px);
        }
        .instructions {
            font-size: 11px;
            color: #aaa;
            margin-top: 8px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <h2>スーパーレジパズル</h2>
    <canvas id="gameCanvas" width="480" height="780"></canvas>
    
    <!-- スマホ操作用の回転・便利ボタン -->
    <div class="controls">
        <button id="rotateBtn">🔄 回す (回転)</button>
    </div>

    <div class="instructions">
        ドラッグ：左右移動 ｜ 下スワイプ：急落下 ｜ 上部ストック：入れ替え
    </div>

    <script>
        window.addEventListener('load', function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const GRID_W = 6;
            const GRID_H = 10;
            const CELL_SIZE = 45;
            const ORIGIN_X = 105;
            const ORIGIN_Y = 160;

            const ITEM_TYPES = [
                { name: "スポンジ", weight: 1, maxLoad: 8, color: "#f1c40f", shape: [[1]] },
                { name: "食パン", weight: 2, maxLoad: 4, color: "#e67e22", shape: [[1, 1]] },
                { name: "牛乳", weight: 3, maxLoad: 6, color: "#2980b9", shape: [[1], [1]] },
                { name: "お弁当", weight: 4, maxLoad: 7, color: "#27ae60", shape: [[1, 1], [1, 1]] },
                { name: "スイカ", weight: 5, maxLoad: 10, color: "#e74c3c", shape: [[1, 1, 1], [1, 1, 1]] }
            ];

            let basketGrid = Array(GRID_W).fill(null).map(() => Array(GRID_H).fill(null));
            let score = 0;
            let gameTime = 60.0;
            let isGameOver = false;

            let currentItem = null;
            let stockItem = null;
            let fallX = 2; 
            let fallY = GRID_H - 1; 
            let normalFallSpeed = 0.5; 

            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;

            function getRandomItem() {
                const template = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
                return {
                    name: template.name,
                    weight: template.weight,
                    maxLoad: template.maxLoad,
                    color: template.color,
                    shape: template.shape.map(row => [...row])
                };
            }

            function resetGame() {
                basketGrid = Array(GRID_W).fill(null).map(() => Array(GRID_H).fill(null));
                score = 0;
                gameTime = 60.0;
                isGameOver = false;
                stockItem = null;
                spawnNewItem();
            }

            function spawnNewItem() {
                currentItem = getRandomItem();
                fallX = Math.floor((GRID_W - currentItem.shape[0].length) / 2);
                fallY = GRID_H - 1;

                if (checkCollision(fallX, fallY, currentItem.shape)) {
                    isGameOver = true;
                }
            }

            function rotateShape(shape) {
                const rows = shape.length;
                const cols = shape[0].length;
                let rotated = Array(cols).fill(0).map(() => Array(rows).fill(0));
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        rotated[c][rows - 1 - r] = shape[r][c];
                    }
                }
                return rotated;
            }

            function checkCollision(x, y, shape) {
                const rows = shape.length;
                const cols = shape[0].length;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (shape[r][c] === 1) {
                            let targetX = x + c;
                            let targetY = y - r;
                            if (targetX < 0 || targetX >= GRID_W || targetY < 0) {
                                return true;
                            }
                            if (targetY < GRID_H && basketGrid[targetX][targetY] !== null) {
                                return true;
                            }
                        }
                    }
                }
                return false;
            }

            // 回転ボタンの処理
            function doRotate() {
                if (isGameOver || !currentItem) return;
                let rotated = rotateShape(currentItem.shape);
                if (!checkCollision(fallX, Math.floor(fallY), rotated)) {
                    currentItem.shape = rotated;
                } else if (!checkCollision(fallX - 1, Math.floor(fallY), rotated)) {
                    fallX -= 1;
                    currentItem.shape = rotated;
                } else if (!checkCollision(fallX + 1, Math.floor(fallY), rotated)) {
                    fallX += 1;
                    currentItem.shape = rotated;
                }
            }

            document.getElementById('rotateBtn').addEventListener('click', doRotate);
            document.getElementById('rotateBtn').addEventListener('touchstart', (e) => {
                e.preventDefault();
                doRotate();
            });

            function handleTouchStart(clientX, clientY) {
                if (isGameOver) {
                    resetGame();
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = (clientX - rect.left) * scaleX;
                const y = (clientY - rect.top) * scaleY;

                // ストックエリアのタップ判定
                if (y >= 75 && y <= 125 && x >= 140 && x <= 230) {
                    if (!stockItem) {
                        stockItem = currentItem;
                        currentItem = getRandomItem();
                    } else {
                        let temp = stockItem;
                        stockItem = currentItem;
                        currentItem = temp;
                    }
                    fallX = Math.floor((GRID_W - currentItem.shape[0].length) / 2);
                    fallY = GRID_H - 1;
                    return;
                }

                isDragging = true;
                dragStartX = x;
                dragStartY = y;
            }

            function handleTouchMove(clientX, clientY) {
                if (!isDragging || isGameOver) return;

                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const x = (clientX - rect.left) * scaleX;

                let newCol = Math.floor((x - ORIGIN_X) / CELL_SIZE);
                if (newCol < 0) newCol = 0;
                if (newCol > GRID_W - currentItem.shape[0].length) {
                    newCol = GRID_W - currentItem.shape[0].length;
                }

                if (!checkCollision(newCol, Math.floor(fallY), currentItem.shape)) {
                    fallX = newCol;
                }
            }

            function handleTouchEnd(clientX, clientY) {
                if (!isDragging) return;
                isDragging = false;

                const rect = canvas.getBoundingClientRect();
                const scaleY = canvas.height / rect.height;
                const y = (clientY - rect.top) * scaleY;
                let diffY = y - dragStartY;

                // 下スワイプなら急落下
                if (diffY > 40) {
                    while (!checkCollision(fallX, Math.floor(fallY) - 1, currentItem.shape) && Math.floor(fallY) > 0) {
                        fallY -= 1;
                    }
                    lockItem();
                }
            }

            canvas.addEventListener('mousedown', (e) => handleTouchStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => handleTouchMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', (e) => handleTouchEnd(e.clientX, e.clientY));

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0) handleTouchStart(e.touches[0].clientX, e.touches[0].clientY);
            });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) handleTouchMove(e.touches[0].clientX, e.touches[0].clientY);
            });
            window.addEventListener('touchend', (e) => {
                if (e.changedTouches.length > 0) handleTouchEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            });

            function lockItem() {
                const rows = currentItem.shape.length;
                const cols = currentItem.shape[0].length;
                let fixedY = Math.floor(fallY);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (currentItem.shape[r][c] === 1) {
                            let gx = fallX + c;
                            let gy = fixedY - r;
                            if (gy >= 0 && gy < GRID_H && gx >= 0 && gx < GRID_W) {
                                if (gy > 0 && basketGrid[gx][gy - 1] !== null) {
                                    let below = basketGrid[gx][gy - 1];
                                    if (currentItem.weight > below.maxLoad) {
                                        basketGrid[gx][gy - 1] = null;
                                        score -= 30;
                                    }
                                }
                                basketGrid[gx][gy] = { name: currentItem.name, color: currentItem.color, weight: currentItem.weight, maxLoad: currentItem.maxLoad };
                            }
                        }
                    }
                }
                score += 100;
                spawnNewItem();
            }

            let lastTime = performance.now();
            function gameLoop(time) {
                let dt = (time - lastTime) / 1000;
                lastTime = time;

                if (!isGameOver) {
                    gameTime -= dt;
                    if (gameTime <= 0) {
                        gameTime = 0;
                        isGameOver = true;
                    }

                    if (!isDragging) {
                        fallY -= normalFallSpeed * dt;
                        if (checkCollision(fallX, Math.floor(fallY), currentItem.shape) || fallY < 0) {
                            fallY = Math.ceil(fallY);
                            lockItem();
                        }
                    }
                }

                // 描画処理
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#fff";
                ctx.font = "15px sans-serif";
                ctx.fillText(`スコア: ${score}`, 25, 30);
                ctx.fillText(`残り時間: ${Math.ceil(gameTime)}秒`, 335, 30);

                // ストック
                ctx.fillStyle = "#444";
                ctx.fillRect(140, 75, 90, 45);
                ctx.strokeStyle = "#777";
                ctx.strokeRect(140, 75, 90, 45);
                ctx.fillStyle = "#aaa";
                ctx.font = "11px sans-serif";
                ctx.fillText("ストック", 162, 67);

                if (stockItem) {
                    ctx.fillStyle = stockItem.color;
                    ctx.fillRect(145, 80, 80, 35);
                    ctx.fillStyle = "#000";
                    ctx.font = "bold 11px sans-serif";
                    ctx.fillText(stockItem.name, 155, 102);
                }

                // つぎの商品
                ctx.fillStyle = "#444";
                ctx.fillRect(250, 75, 90, 45);
                ctx.strokeRect(250, 75, 90, 45);
                ctx.fillStyle = "#aaa";
                ctx.fillText("つぎの商品", 265, 67);

                if (currentItem) {
                    ctx.fillStyle = currentItem.color;
                    ctx.fillRect(255, 80, 80, 35);
                    ctx.fillStyle = "#000";
                    ctx.font = "bold 11px sans-serif";
                    ctx.fillText(currentItem.name, 265, 102);
                }

                // カゴ
                ctx.fillStyle = "#333";
                ctx.fillRect(ORIGIN_X - 5, ORIGIN_Y - 5, GRID_W * CELL_SIZE + 10, GRID_H * CELL_SIZE + 10);
                ctx.fillStyle = "#ecf0f1";
                ctx.fillRect(ORIGIN_X, ORIGIN_Y, GRID_W * CELL_SIZE, GRID_H * CELL_SIZE);

                ctx.strokeStyle = "#bdc3c7";
                ctx.lineWidth = 1;
                for (let x = 0; x <= GRID_W; x++) {
                    ctx.beginPath();
                    ctx.moveTo(ORIGIN_X + x * CELL_SIZE, ORIGIN_Y);
                    ctx.lineTo(ORIGIN_X + x * CELL_SIZE, ORIGIN_Y + GRID_H * CELL_SIZE);
                    ctx.stroke();
                }
                for (let y = 0; y <= GRID_H; y++) {
                    ctx.beginPath();
                    ctx.moveTo(ORIGIN_X, ORIGIN_Y + y * CELL_SIZE);
                    ctx.lineTo(ORIGIN_X + GRID_W * CELL_SIZE, ORIGIN_Y + y * CELL_SIZE);
                    ctx.stroke();
                }

                for (let x = 0; x < GRID_W; x++) {
                    for (let y = 0; y < GRID_H; y++) {
                        let item = basketGrid[x][y];
                        if (item) {
                            let drawY = ORIGIN_Y + (GRID_H - 1 - y) * CELL_SIZE;
                            let drawX = ORIGIN_X + x * CELL_SIZE;
                            ctx.fillStyle = item.color;
                            ctx.fillRect(drawX + 2, drawY + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                        }
                    }
                }

                if (currentItem && !isGameOver) {
                    const rows = currentItem.shape.length;
                    const cols = currentItem.shape[0].length;
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            if (currentItem.shape[r][c] === 1) {
                                let gx = fallX + c;
                                let gy = Math.floor(fallY) - r;
                                let drawX = ORIGIN_X + gx * CELL_SIZE;
                                let drawY = ORIGIN_Y + (GRID_H - 1 - gy) * CELL_SIZE;
                                ctx.fillStyle = currentItem.color;
                                ctx.fillRect(drawX + 2, drawY + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                            }
                        }
                    }
                }

                if (isGameOver) {
                    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = "#fff";
                    ctx.font = "24px sans-serif";
                    ctx.fillText("ゲームオーバー", 160, 350);
                    ctx.font = "18px sans-serif";
                    ctx.fillText(`最終スコア: ${score}`, 185, 400);
                    ctx.font = "14px sans-serif";
                    ctx.fillText("画面をタップして再挑戦", 170, 450);
                }

                requestAnimationFrame(gameLoop);
            }

            spawnNewItem();
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
