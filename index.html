<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bonx Banx: Full Custom Edition</title>
    <style>
        html, body {
            margin: 0;
            padding: 10px 0;
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: 'Courier New', monospace;
            text-align: center;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 0 10px;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            padding: 8px 14px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            background: #2a2a2a;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 8px;
        }
        #canvas-wrapper {
            width: 100%;
            margin-bottom: 15px;
        }
        canvas {
            background-color: #0d0d11;
            border: 5px solid #3a2211; /* 壁の色に合わせた枠線 */
            border-radius: 8px;
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        #controller {
            margin: 10px auto;
            display: grid;
            grid-template-columns: repeat(3, 62px);
            grid-template-rows: repeat(3, 62px);
            gap: 12px;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(145deg, #3a3a3a, #262626);
            border: 2px solid #444;
            color: #fff;
            font-size: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 0 #1a1a1a;
            transition: all 0.05s ease;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            cursor: pointer; /* PCでマウスを乗せた時に指マークにする */
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1a1a1a;
            background: #222;
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

<div id="game-container">

    <div id="canvas-wrapper">

function initAudio() {
    if (isAudioInit) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isAudioInit = true;
}

function playSound(freq, duration, type = 'square', volume = 0.06) {
    if (!audioCtx || freq === 0) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; 
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

function playStartSound() {
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((f, i) => { setTimeout(() => playSound(f, 0.08, 'square'), i * 60); });
}

function playClearSound() {
    const notes = [587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50];
    notes.forEach((f, i) => {
        let d = (i === notes.length - 1) ? 0.6 : 0.08;
        setTimeout(() => playSound(f, d, 'square'), i * 80);
    });
}

function playDeadSound() {
    playSound(880, 0.1, 'sawtooth', 0.08);
    setTimeout(() => playSound(587, 0.1, 'sawtooth', 0.08), 70);
    setTimeout(() => {
        let now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.5);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.0001, now + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.5);
    }, 140);
}

function playGameOverSound() {
    const notes = [392.00, 349.23, 311.13, 293.66, 261.63, 196.00];
    notes.forEach((f, i) => {
        let d = (i === notes.length - 1) ? 0.8 : 0.15;
        setTimeout(() => playSound(f, d, 'square', 0.08), i * 140);
    });
}

function startBGM() {
    if (bgmInterval) clearInterval(bgmInterval);
    bgmStep = 0; bgmTicks = 0;
    bgmInterval = setInterval(() => {
        if (gameState !== "PLAYING") return; 
        if (bgmTicks === 0) {
            let note = bgmSequence[bgmStep];
            if (note.f > 0) playSound(note.f, note.d * 0.09, 'square'); 
            bgmTicks = note.d; bgmStep = (bgmStep + 1) % bgmSequence.length;
        }
        bgmTicks--;
    }, 130);
}

function drawCustomArt(artArray, mapX, mapY, type, blink = false) {
    if (blink && !blinkState) return; 
    let srcSize = 32; 
    let pixelSize = 1; 

    for (let r = 0; r < srcSize; r++) {
        for (let c = 0; c < srcSize; c++) {
            let char = artArray[r][c];
            if (char === "0" || char === undefined) continue; 
            
            if (type === "player") {
                if(char === "k") ctx.fillStyle = "#ff1493";      
                else if(char === "p") ctx.fillStyle = "#ffb6c1"; 
                else if(char === "b") ctx.fillStyle = "#000000"; 
            }
            else if (type === "enemy") {
                if(char === "k") ctx.fillStyle = "#00008b";      
                else if(char === "p") ctx.fillStyle = "#00ffff"; 
                else if(char === "b") ctx.fillStyle = "#000000"; 
            }
            else if (type === "block") {
                if(char === "3") ctx.fillStyle = "#00008b";      
                else if(char === "2") ctx.fillStyle = "#0000ff"; 
                else if(char === "1") ctx.fillStyle = "#00ffff"; 
            }
            else if (type === "wall") {
                if(char === "3") ctx.fillStyle = "#4a2211";      
                else if(char === "2") ctx.fillStyle = "#7a3e20"; 
                else if(char === "1") ctx.fillStyle = "#a85d38"; 
                else if(char === "9") ctx.fillStyle = "#2b140a"; 
            }
            else if (type === "carrot") {
                if(char === "5") ctx.fillStyle = "#006400";      
                else if(char === "4") ctx.fillStyle = "#32cd32"; 
                else if(char === "3") ctx.fillStyle = "#8b4513"; 
                else if(char === "2") ctx.fillStyle = "#ff8c00"; 
            }
            else if (type === "house") {
                if(char === "4") ctx.fillStyle = "#5c2e16";      
                else if(char === "3") ctx.fillStyle = "#d32f2f"; 
                else if(char === "2") ctx.fillStyle = "#fbc02d"; 
                else if(char === "1") ctx.fillStyle = "#29b6f6"; 
            }
            ctx.fillRect(mapX * TILE_SIZE + c * pixelSize, mapY * TILE_SIZE + r * pixelSize, pixelSize, pixelSize);
        }
    }
}

    for(let y=0; y<MAP_ROWS; y++) for(let x=0; x<MAP_COLS; x++) map[y][x] = 0;

        const line = stageLines[y] || "................";
        for (let x = 0; x < MAP_COLS; x++) {
            const char = line[x] || ".";
            if (char === "#") map[y][x] = 1;
            else if (char === "B") map[y][x] = 2;
            else if (char === "C") map[y][x] = 3;
            else if (char === "P") player = { x: x, y: y };
            else if (char === "E") {
                enemy = { x: x, y: y };
                enemyDir = (round % 3 === 0) ? 2 : (round % 2 === 0) ? 3 : 1; 
            }
            else if (char === "G") { goalX = x; goalY = y; map[y][x] = 9; }
        }
    }
}

function initTitleScreen() {
    gameState = "TITLE";
    if(gameTimer) clearInterval(gameTimer);
    if(titleTimer) clearInterval(titleTimer);
    titleTimer = setInterval(() => { if(gameState === "TITLE") { blinkState = !blinkState; draw(); } }, 400);
}

function startGame() {
    if(titleTimer) clearInterval(titleTimer);
    initAudio();
    round = selectedRound; score = 0;
    document.getElementById("score").innerText = score;
    initStage();
}

function initStage() {
    if(gameTimer) clearInterval(gameTimer); 
    const stageLines = STAGES[round] || STAGES[1];
    parseTextMap(stageLines);
    document.getElementById("round").innerText = round;
    gameState = "START_READY"; readyTimerCount = 0; blinkState = true;
    playStartSound();

    gameTimer = setInterval(() => {
        if (gameState === "START_READY") {
            readyTimerCount++;
            if (readyTimerCount >= 6) { gameState = "PLAYING"; startBGM(); }
            draw();
        } else if (gameState === "PLAYING") {
            updateEnemy(); draw();
        } else if (gameState === "STAGE_CLEAR_PERFORM") {
            clearTimerCount++;
            if (clearTimerCount >= 10) { round++; if(!STAGES[round]) round = 1; initStage(); }
            draw();
        } else if (gameState === "GAMEOVER_PERFORM") {
            blinkState = !blinkState; 
            draw();
        } else if (gameState === "GAMEOVER_BLINKING") {
            readyTimerCount++; blinkState = !blinkState; 
            if (readyTimerCount >= 8) initTitleScreen();
            draw();
        }
    }, 250);
}

function triggerGameOver() {
    if (gameState === "GAMEOVER_PERFORM" || gameState === "GAMEOVER_BLINKING") return; 
    gameState = "GAMEOVER_PERFORM"; 
    
    if(bgmInterval) clearInterval(bgmInterval);
    playDeadSound();
    
    setTimeout(() => {
        playGameOverSound(); 
        gameState = "GAMEOVER_BLINKING"; 
        readyTimerCount = 0; 
        blinkState = true;
    }, 1000); 
}

function updateEnemy() {
    if (gameState !== "PLAYING") return; 

    let dx = 0, dy = 0;
    if (enemyDir === 0) dy = -1; if (enemyDir === 1) dx = 1; if (enemyDir === 2) dy = 1; if (enemyDir === 3) dx = -1;
    let nextX = enemy.x + dx; let nextY = enemy.y + dy;
    let isBlocked = false;
    if (nextX < 0 || nextX >= MAP_COLS || nextY < 0 || nextY >= MAP_ROWS) isBlocked = true;
    else {
        let checkTile = map[nextY][nextX];
        if (checkTile === 1 || checkTile === 2) isBlocked = true;
    }

    if (!isBlocked) {
        enemy.x = nextX; enemy.y = nextY;
        if (map[enemy.y][enemy.x] === 3) {
            map[enemy.y][enemy.x] = 0; score += 500; 
            document.getElementById("score").innerText = score;
            playSound(180, 0.05, 'square'); setTimeout(() => playSound(120, 0.05, 'square'), 60);
        }
    } else { enemyDir = (enemyDir + 1) % 4; }

    if (map[enemy.y][enemy.x] === 9) {
        if(bgmInterval) clearInterval(bgmInterval);
        playClearSound(); gameState = "STAGE_CLEAR_PERFORM"; clearTimerCount = 0;
        return;
    }
    
    if (enemy.x === player.x && enemy.y === player.y) {
        triggerGameOver();
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (gameState === "TITLE") {
        ctx.fillStyle = "#0d0d11"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffcc00"; ctx.font = "bold 40px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("BONX BANX", canvas.width / 2, 110);
        ctx.fillStyle = "#00ffff"; ctx.font = "bold 20px 'Courier New'";
        ctx.fillText(`STAGE SELECT: < ROUND ${selectedRound} >`, canvas.width / 2, 190);
        ctx.fillStyle = "#ffffff"; ctx.font = "16px 'Courier New'";
        if (blinkState) ctx.fillText("PRESS ANY KEY OR BUTTON", canvas.width / 2, 250);
        ctx.fillStyle = "#ffff00"; ctx.font = "16px 'Courier New'";
        ctx.fillText("上下でスタート　　左右でステージ選択", canvas.width / 2, 280);
        ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Courier New'";
        ctx.fillText("mokuyoshi", canvas.width / 2, 340);
        return;
    }

    for (let y = 0; y < MAP_ROWS; y++) {
        for (let x = 0; x < MAP_COLS; x++) {
            if (map[y][x] === 1) drawCustomArt(newArt.wall, x, y, "wall");
            else if (map[y][x] === 3) drawCustomArt(newArt.carrot, x, y, "carrot");
            else if (map[y][x] === 2) drawCustomArt(newArt.block, x, y, "block");
            else if (map[y][x] === 9) drawCustomArt(newArt.house, x, y, "house");
        }
    }

    let isBlinking = (gameState === "GAMEOVER_BLINKING" || gameState === "GAMEOVER_PERFORM");
    drawCustomArt(newArt.enemy, enemy.x, enemy.y, "enemy", isBlinking);
    drawCustomArt(newArt.player, player.x, player.y, "player", isBlinking);
    
    if (gameState === "START_READY") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 140, canvas.width, 100);
        ctx.fillStyle = "#00ffff"; ctx.font = "bold 32px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText(`ROUND ${round}`, canvas.width / 2, 185);
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px 'Courier New'"; ctx.fillText("READY?", canvas.width / 2, 220);
    }
    if (gameState === "STAGE_CLEAR_PERFORM") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; ctx.fillRect(0, 140, canvas.width, 100);
        ctx.fillStyle = "#ffcc00"; ctx.font = "bold 36px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("STAGE CLEAR !!", canvas.width / 2, 200);
    }
    
    if (gameState === "GAMEOVER_BLINKING") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.fillRect(0, 140, canvas.width, 100);
        ctx.fillStyle = "#cc0000"; ctx.font = "bold 40px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, 200);
    }
}

function handleTitleInput(action) {
    if (action === "LEFT") {
        selectedRound--; if (selectedRound < 1) selectedRound = 10; 
        playSound(440, 0.05, 'triangle');
    } else if (action === "RIGHT") {
        selectedRound++; if (selectedRound > 10) selectedRound = 1; 
        playSound(440, 0.05, 'triangle');
    } else if (action === "START") {
        startGame();
    }
    draw();
}

function movePlayer(dx, dy) {
    if (gameState === "TITLE") {
        if (dx === -1) handleTitleInput("LEFT"); if (dx === 1) handleTitleInput("RIGHT");
        if (dy === -1 || dy === 1) handleTitleInput("START");
        return;
    }
    if (gameState !== "PLAYING") return; 
    
    let nextX = player.x + dx; let nextY = player.y + dy;
    if (nextX < 0 || nextX >= MAP_COLS || nextY < 0 || nextY >= MAP_ROWS) return;

    let tile = map[nextY][nextX];
    if (tile !== 1 && tile !== 9) { 
        if (tile === 2) { 
            let pushX = nextX + dx; let pushY = nextY + dy;
            if (pushX >= 0 && pushX < MAP_COLS && pushY >= 0 && pushY < MAP_ROWS) {
                if (map[pushY][pushX] === 0) { 
                    map[nextY][nextX] = 0; map[pushY][pushX] = 2;
                    player.x = nextX; player.y = nextY; score += 10;
                    document.getElementById("score").innerText = score;
                    playSound(150, 0.1, 'triangle');
                }
            }
        } else {
            playSound(600, 0.03, 'triangle'); player.x = nextX; player.y = nextY;
        }
    }

    if (player.x === enemy.x && player.y === enemy.y) {
        triggerGameOver();
    }

    draw();
}

// 🖱️ タッチ・クリック両対応用のバインド処理
function bindBtn(id, dx, dy) {
    const btn = document.getElementById(id);
    
    // スマホのタッチ
    btn.addEventListener("touchstart", (e) => { 
        e.preventDefault(); 
        movePlayer(dx, dy); 
    });
    
    // PCのクリック
    btn.addEventListener("mousedown", (e) => { 
        e.preventDefault(); 
        movePlayer(dx, dy); 
    });
}

// ⌨️ キーボードイベント
window.addEventListener("keydown", (e) => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Enter"].includes(e.key)) {
        e.preventDefault(); 
    }
    if (gameState === "TITLE") {
        if (e.key === "Enter" || e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") handleTitleInput("START");
        if (e.key === "ArrowLeft") handleTitleInput("LEFT");
        if (e.key === "ArrowRight") handleTitleInput("RIGHT");
    } else if (gameState === "PLAYING") {
        if (e.key === "ArrowUp") movePlayer(0, -1);
        if (e.key === "ArrowDown") movePlayer(0, 1);
        if (e.key === "ArrowLeft") movePlayer(-1, 0);
        if (e.key === "ArrowRight") movePlayer(1, 0);
    }
});

// タイトルでの画面クリック対応
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); if (gameState === "TITLE") handleTitleInput("START"); });
canvas.addEventListener("mousedown", (e) => { e.preventDefault(); if (gameState === "TITLE") handleTitleInput("START"); });

bindBtn("btn-up", 0, -1); bindBtn("btn-down", 0, 1); bindBtn("btn-left", -1, 0); bindBtn("btn-right", 1, 0);
initTitleScreen();
</script>
